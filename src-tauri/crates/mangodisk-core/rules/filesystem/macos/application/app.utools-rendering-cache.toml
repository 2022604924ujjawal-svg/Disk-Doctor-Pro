# uTools stores clipboard history, plugins, databases, and browser state beside
# Electron renderer caches. The rule owns only fixed disposable cache leaves.
id = "app.utools-rendering-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["uTools"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["org.yuanli.utools", "uTools"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${application_support}/uTools/Cache"

[[roots]]
template = "${application_support}/uTools/Code Cache"

[[roots]]
template = "${application_support}/uTools/GPUCache"

[[roots]]
template = "${application_support}/uTools/DawnCache"

[[roots]]
template = "${application_support}/uTools/DawnGraphiteCache"

[[roots]]
template = "${application_support}/uTools/DawnWebGPUCache"

[[roots]]
template = "${application_support}/uTools/GrShaderCache"

[[roots]]
template = "${application_support}/uTools/GraphiteDawnCache"

[[roots]]
template = "${application_support}/uTools/Shared Dictionary/cache"

[[roots]]
template = "${application_support}/uTools/Service Worker/CacheStorage"

[[roots]]
template = "${application_support}/uTools/logs"

[[roots]]
template = "${application_support}/uTools/Crashpad/reports"

# Each direct child is one renderer partition. Clipboard data, plugins,
# databases, Local Storage, and every other partition entry remain excluded.
[[roots]]
template = "${application_support}/uTools/Partitions"
kind = "childDirectories"
include_all_children = true
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache", "Service Worker/CacheStorage"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Notarized uTools 7.8.0 reproduced one renderer partition and fixed Electron cache leaves. Clipboard history, plugins, databases, Local Storage, settings, and browser state are excluded"
verified_at = "2026-08-11"
verified_platform = "macos"
references = [
  "https://www.u-tools.cn/",
  "https://www.electronjs.org/docs/latest/api/app#appgetpathname",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

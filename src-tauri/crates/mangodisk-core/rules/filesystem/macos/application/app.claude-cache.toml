# Claude Desktop keeps sessions, credentials, local-agent work, configuration,
# and browser storage beside fixed Electron renderer caches. Select only the
# rebuildable leaves and direct-partition suffixes.
id = "app.claude-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "application"
risk = "safe"
default_selected = true
required_stopped_processes = ["Claude"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.anthropic.claudefordesktop", "Claude"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/com.anthropic.claudefordesktop"

[[roots]]
template = "${application_support}/Claude/Cache"

[[roots]]
template = "${application_support}/Claude/Code Cache"

[[roots]]
template = "${application_support}/Claude/GPUCache"

[[roots]]
template = "${application_support}/Claude/DawnCache"

[[roots]]
template = "${application_support}/Claude/DawnGraphiteCache"

[[roots]]
template = "${application_support}/Claude/DawnWebGPUCache"

[[roots]]
template = "${application_support}/Claude/GrShaderCache"

[[roots]]
template = "${application_support}/Claude/GraphiteDawnCache"

[[roots]]
template = "${application_support}/Claude/Shared Dictionary/cache"

[[roots]]
template = "${application_support}/Claude/Service Worker/CacheStorage"

[[roots]]
template = "${application_support}/Claude/Crashpad/reports"

# Cowork and file-preview surfaces use direct Electron partitions. The
# partition itself is never selected, so its cookies and storage stay intact.
[[roots]]
template = "${application_support}/Claude/Partitions"
kind = "childDirectories"
include_all_children = true
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache", "Service Worker/CacheStorage"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Notarized Claude Desktop 1.24012.9 reproduced fixed top-level and direct-partition Electron cache leaves. Sessions, credentials, local-agent work, configuration, cookies, browser storage, logs, and extensions remain excluded"
verified_at = "2026-08-11"
verified_platform = "macos"
references = [
  "https://support.claude.com/en/articles/10065433-install-claude-desktop",
  "https://www.electronjs.org/docs/latest/api/app#appgetpathname",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

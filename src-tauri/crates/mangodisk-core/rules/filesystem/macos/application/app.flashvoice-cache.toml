# FlashVoice stores downloaded speech models, recordings, transcription
# indexes, and settings under Application Support. Only its standard WebKit
# cache and isolated diagnostic-log root are disposable.
id = "app.flashvoice-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["FlashVoice"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.flashvoices", "FlashVoice"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/FlashVoice"

[[roots]]
template = "${application_support}/com.flashvoices/logs"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Notarized FlashVoice 1.4.4 reproduced a standard WebKit NetworkCache and isolated logs. Speech models, recordings, transcriptions, indexes, onboarding state, window state, installation identity, and configuration are excluded"
verified_at = "2026-08-11"
verified_platform = "macos"
references = [
  "https://developer.apple.com/documentation/foundation/filemanager/searchpathdirectory/cachesdirectory",
]

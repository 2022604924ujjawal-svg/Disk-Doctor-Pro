# Only standard application roots under Library/Caches are used. Spotify
# PersistentCache, podcast downloads, music libraries, and video files are
# outside the rule boundary.
id = "app.media-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "application"
risk = "safe"
default_selected = true
required_stopped_processes = ["Spotify", "Music", "Podcasts", "TV", "IINA"]

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${user_library}/Caches/com.spotify.client"

[[roots]]
template = "${user_library}/Caches/com.apple.Music"

[[roots]]
template = "${user_library}/Caches/com.apple.podcasts"

[[roots]]
template = "${user_library}/Caches/com.apple.TV"

[[roots]]
template = "${user_library}/Caches/com.colliderli.iina"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Only app-specific Library/Caches roots are selected. Media libraries, playlists, downloads, preferences, and offline content remain outside the roots; VLC uses a dedicated rule for its artwork and crash cache"
verified_at = "2026-08-11"
verified_platform = "macos"
references = [
  "https://developer.apple.com/documentation/foundation/url/cachesdirectory",
]

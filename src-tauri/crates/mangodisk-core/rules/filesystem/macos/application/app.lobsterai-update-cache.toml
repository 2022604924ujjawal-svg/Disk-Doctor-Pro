# LobsterAI keeps downloaded automatic-update disk images beside its durable
# skills, OpenClaw state, database, and preferences. Match only the generated
# updater filename so no sibling application data can enter the boundary.
id = "app.lobsterai-update-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["LobsterAI"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.lobsterai.app", "LobsterAI"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${application_support}/LobsterAI/updates"

[matcher]
kind = "allOf"
items = [
  { kind = "nameGlob", values = ["lobsterai-update-auto-*.dmg"] },
  { kind = "maxDepth", depth = 1 },
]

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed LobsterAI 2026.6.10 reproduced a 339 MiB timestamped automatic-update DMG. Bundled updater metadata identifies its GitHub release provider; skills, OpenClaw state, database, and preferences are excluded"
verified_at = "2026-08-11"
verified_platform = "macos"
references = ["https://github.com/netease-youdao/LobsterAI"]

# Lark stores account and workspace state beside its embedded Chromium data.
# Only explicit shader, code, and HTTP rendering caches are included.
id = "app.lark-renderer-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["Lark", "Feishu", "LarkShell", "Lark Helper", "Lark Helper (GPU)", "Lark Helper (Renderer)"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.electron.lark", "com.bytedance.lark", "Lark", "Feishu"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/LarkShell/aha/users"
kind = "childDirectories"
include_all_children = true
suffixes = ["profile_explorer/Cache", "profile_explorer/Code Cache", "profile_main/Cache", "profile_main/Code Cache", "profile_global/Cache", "profile_global/Code Cache"]

# AHA profiles mix credentials, history, databases, workspace state, and a
# large Service Worker response cache. Dynamic discovery is limited to direct
# account roots and fixed renderer-cache leaves inside their known profiles.
[[roots]]
template = "${application_support}/LarkShell/aha/users"
kind = "childDirectories"
include_all_children = true
suffixes = ["profile_explorer/Cache", "profile_explorer/Code Cache", "profile_explorer/GPUCache", "profile_explorer/DawnCache", "profile_explorer/DawnGraphiteCache", "profile_explorer/DawnWebGPUCache", "profile_explorer/GrShaderCache", "profile_explorer/GraphiteDawnCache", "profile_explorer/Shared Dictionary/cache", "profile_explorer/Service Worker/CacheStorage", "profile_main/Cache", "profile_main/Code Cache", "profile_main/GPUCache", "profile_main/DawnCache", "profile_main/DawnGraphiteCache", "profile_main/DawnWebGPUCache", "profile_main/GrShaderCache", "profile_main/GraphiteDawnCache", "profile_main/Shared Dictionary/cache", "profile_main/Service Worker/CacheStorage", "profile_global/Cache", "profile_global/Code Cache", "profile_global/GPUCache", "profile_global/DawnCache", "profile_global/DawnGraphiteCache", "profile_global/DawnWebGPUCache", "profile_global/GrShaderCache", "profile_global/GraphiteDawnCache", "profile_global/Shared Dictionary/cache", "profile_global/Service Worker/CacheStorage"]

# Iron maintains a second set of account-scoped Chromium profiles. The same
# fixed suffix policy leaves cookies, storage databases, and Service Worker
# registration/script state untouched.
[[roots]]
template = "${application_support}/LarkShell/iron/users"
kind = "childDirectories"
include_all_children = true
suffixes = ["profile_explorer/Cache", "profile_explorer/Code Cache", "profile_explorer/GPUCache", "profile_explorer/DawnCache", "profile_explorer/DawnGraphiteCache", "profile_explorer/DawnWebGPUCache", "profile_explorer/GrShaderCache", "profile_explorer/GraphiteDawnCache", "profile_explorer/Shared Dictionary/cache", "profile_explorer/Service Worker/CacheStorage", "profile_main/Cache", "profile_main/Code Cache", "profile_main/GPUCache", "profile_main/DawnCache", "profile_main/DawnGraphiteCache", "profile_main/DawnWebGPUCache", "profile_main/GrShaderCache", "profile_main/GraphiteDawnCache", "profile_main/Shared Dictionary/cache", "profile_main/Service Worker/CacheStorage", "profile_global/Cache", "profile_global/Code Cache", "profile_global/GPUCache", "profile_global/DawnCache", "profile_global/DawnGraphiteCache", "profile_global/DawnWebGPUCache", "profile_global/GrShaderCache", "profile_global/GraphiteDawnCache", "profile_global/Shared Dictionary/cache", "profile_global/Service Worker/CacheStorage"]

[[roots]]
template = "${application_support}/LarkShell/ShaderCache"

[[roots]]
template = "${application_support}/LarkShell/GrShaderCache"

[[roots]]
template = "${application_support}/LarkShell/GraphiteDawnCache"

[[roots]]
template = "${application_support}/LarkShell/CodeCache"

[[roots]]
template = "${application_support}/LarkShell/component_crx_cache"

[[roots]]
template = "${application_support}/LarkShell/iron/Cache"

[[roots]]
template = "${application_support}/LarkShell/iron/GPUCache"

[[roots]]
template = "${application_support}/LarkShell/iron/Shared Dictionary/cache"

[[roots]]
template = "${application_support}/LarkShell/iron/Code Cache"

[[roots]]
template = "${application_support}/LarkShell/iron/DawnCache"

[[roots]]
template = "${application_support}/LarkShell/iron/DawnGraphiteCache"

[[roots]]
template = "${application_support}/LarkShell/iron/DawnWebGPUCache"

[[roots]]
template = "${application_support}/LarkShell/iron/GrShaderCache"

[[roots]]
template = "${application_support}/LarkShell/iron/GraphiteDawnCache"

[[roots]]
template = "${application_support}/LarkShell/iron/Service Worker/CacheStorage"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed Lark build 131.0.6778.268 reported 4.79 GB in Clear Cache. Real AHA and Iron profiles reproduced 4.23 GiB CacheStorage; fixed suffixes exclude cookies, history, databases, messages, downloads, and workspace state"
verified_at = "2026-08-11"
verified_platform = "macos"
references = [
  "https://www.larksuite.com/hc/en-US/articles/360048488246-clear-cache-and-system-reset-faqs",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

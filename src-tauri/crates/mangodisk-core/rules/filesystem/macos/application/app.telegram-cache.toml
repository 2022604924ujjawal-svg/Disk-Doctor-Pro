# Both current and legacy Telegram bundle identifiers are supported. Message
# databases, downloaded media, and account state remain outside these bundle
# cache roots.
id = "app.telegram-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = true
required_stopped_processes = ["Telegram"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.tdesktop.Telegram", "ru.keepcoder.Telegram", "Telegram"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/com.tdesktop.Telegram"

[[roots]]
template = "${user_library}/Caches/ru.keepcoder.Telegram"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "The rule selects only current and legacy Telegram bundle directories under Library/Caches, which Apple designates for discardable files; message, media, account, and preference data remain outside the roots"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://developer.apple.com/documentation/foundation/url/cachesdirectory"]

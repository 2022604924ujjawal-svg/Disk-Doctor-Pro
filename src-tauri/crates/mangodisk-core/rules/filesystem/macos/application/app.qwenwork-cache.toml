# QwenWork keeps authentication, workspaces, conversations, generated files,
# and awareness memory beside its Electron caches. Dynamic discovery stops at
# direct renderer partitions and appends fixed cache suffixes only.
id = "app.qwenwork-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["QwenWorkCN"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["cn.qwenwork.desktop.mac", "QwenWorkCN"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${application_support}/QwenWorkCN/Cache"

[[roots]]
template = "${application_support}/QwenWorkCN/Code Cache"

[[roots]]
template = "${application_support}/QwenWorkCN/GPUCache"

[[roots]]
template = "${application_support}/QwenWorkCN/DawnCache"

[[roots]]
template = "${application_support}/QwenWorkCN/DawnGraphiteCache"

[[roots]]
template = "${application_support}/QwenWorkCN/DawnWebGPUCache"

[[roots]]
template = "${application_support}/QwenWorkCN/GrShaderCache"

[[roots]]
template = "${application_support}/QwenWorkCN/GraphiteDawnCache"

[[roots]]
template = "${application_support}/QwenWorkCN/Shared Dictionary/cache"

[[roots]]
template = "${application_support}/QwenWorkCN/logs"

[[roots]]
template = "${application_support}/QwenWorkCN/Crashpad/reports"

[[roots]]
template = "${application_support}/QwenWorkCN/Partitions"
kind = "childDirectories"
include_all_children = true
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed QwenWorkCN 0.1.6 reproduced one renderer partition and fixed Electron cache and log roots. Authentication, workspace, data, Local Storage, sessions, preferences, conversations, generated files, and awareness memory are excluded"
verified_at = "2026-08-11"
verified_platform = "macos"
references = [
  "https://www.electronjs.org/docs/latest/api/app#appgetpathname",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

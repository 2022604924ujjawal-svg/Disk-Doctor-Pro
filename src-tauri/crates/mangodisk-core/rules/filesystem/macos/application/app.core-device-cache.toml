id = "app.core-device-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "application"
risk = "recoverable"
default_selected = false
recommended_selected = true
required_stopped_processes = []

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${user_library}/Containers/com.apple.CoreDevice.CoreDeviceService/Data/Library/Caches"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "The rule is confined to the CoreDevice service container's Library/Caches directory; Apple defines container cache files as discardable, while device backup and support data remain outside the root"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://developer.apple.com/documentation/foundation/using-the-file-system-effectively"]

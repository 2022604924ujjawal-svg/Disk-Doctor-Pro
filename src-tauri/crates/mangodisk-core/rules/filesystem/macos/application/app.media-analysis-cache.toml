id = "app.media-analysis-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = true
required_stopped_processes = []

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${user_library}/Containers/com.apple.mediaanalysisd/Data/Library/Caches"

[[roots]]
template = "${user_library}/Containers/com.apple.mediaanalysisd/Data/tmp"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "The rule selects only the mediaanalysisd container's Library/Caches and tmp directories; Apple defines both locations for purgeable or short-lived files"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://developer.apple.com/documentation/foundation/using-the-file-system-effectively"]

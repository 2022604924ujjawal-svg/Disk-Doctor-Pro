# DingTalk's own Storage Space page separates cached mini apps, temporary
# images, cards, GIF emoji, and web data from chat data and other account data.
# Dynamic expansion reaches only fixed cache leaves below direct account roots.
id = "app.dingtalk-content-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["DingTalk", "DingTalkMac"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.alibaba.DingTalkMac", "DingTalk"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${application_support}/DingTalkMac"
kind = "childDirectories"
include_all_children = true
suffixes = ["EAppFiles", "ImageFiles", "GifEmotionFiles", "wave_cards", "theme_cache", "Sync_v2/cache"]
verified_rebuildable = true

[[roots]]
template = "${user_library}/Caches/com.alibaba.DingTalkMac/WebKit/NetworkCache"

[[roots]]
template = "${user_library}/Caches/com.alibaba.DingTalkMac/WebKit/CacheStorage"

[[roots]]
template = "${user_library}/Caches/com.alibaba.DingTalkMac/thumbnails"

[[roots]]
template = "${user_library}/Caches/com.alibaba.DingTalkMac/fsCachedData"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "DingTalk 8.3.45 classified 1.2 GB of mini-app, temporary-image, card, GIF, and web data as safe-to-clean cache. Chat databases, 2.44 GiB resource_cache, messages, downloads, settings, and accounts are excluded"
verified_at = "2026-08-11"
verified_platform = "macos"
references = ["https://page.dingtalk.com/wow/z/dingtalk/default/585885"]

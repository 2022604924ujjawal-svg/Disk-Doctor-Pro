# Clash Verge keeps active profiles, configuration, GeoIP databases, and its
# runtime core beside diagnostics. Only the dedicated log directory is owned.
id = "app.clash-verge-diagnostic-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["clash-verge"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["io.github.clash-verge-rev.clash-verge-rev", "Clash Verge"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${application_support}/io.github.clash-verge-rev.clash-verge-rev/logs"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Notarized Clash Verge 2.4.7 reproduced a dedicated diagnostic log root. Profiles, configuration, runtime binaries, GeoIP data, WebKit storage, and account state remain outside the selected boundary"
verified_at = "2026-08-11"
verified_platform = "macos"
references = ["https://github.com/clash-verge-rev/clash-verge-rev"]

# Telegram stores account keys, settings, messages, and downloaded media beside
# these roots. Keep the boundary fixed to notification temporaries and the
# Crashpad database so hashed tdata state can never enter by broad discovery.
id = "app.telegram-temporary-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["Telegram"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.tdesktop.Telegram", "ru.keepcoder.Telegram", "Telegram"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${application_support}/Telegram Desktop/tdata/temp"

[[roots]]
template = "${application_support}/Telegram Desktop/tdata/dumps"

[matcher]
kind = "extensionIn"
values = ["dmp", "dat", "tmp", "png", "ico", "ics"]

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Telegram 7.0.1 source assigns notification images to tdata/temp and macOS Crashpad to tdata/dumps. The signed client reproduced dumps; account keys, settings, messages, media, emoji, and other tdata entries are excluded"
verified_at = "2026-08-11"
verified_platform = "macos"
references = ["https://github.com/telegramdesktop/tdesktop/tree/v7.0.1"]

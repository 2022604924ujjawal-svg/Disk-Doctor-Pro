# Slack's Electron caches are separate from account and session databases. Only
# explicit rendering cache directories are included; Local Storage, IndexedDB,
# cookies, and workspace data are excluded.
id = "app.slack-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "application"
risk = "safe"
default_selected = true
required_stopped_processes = ["Slack"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.tinyspeck.slackmacgap", "Slack"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/com.tinyspeck.slackmacgap"

[[roots]]
template = "${application_support}/Slack/Cache"

[[roots]]
template = "${application_support}/Slack/Code Cache"

[[roots]]
template = "${application_support}/Slack/GPUCache"

# Chromium's Cache Storage API keeps rebuildable Slack web responses here.
# Service Worker scripts and databases remain outside this nested boundary.
[[roots]]
template = "${application_support}/Slack/Service Worker/CacheStorage"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Slack 4.49.81 reproduced 442 MiB in Service Worker/CacheStorage. Slack officially supports Clear Cache and Restart; fixed roots exclude accounts, sessions, workspaces, Local Storage, IndexedDB, service-worker databases, and downloads"
verified_at = "2026-08-11"
verified_platform = "macos"
references = [
  "https://slack.com/help/articles/205138367-Troubleshoot-connection-issues",
  "https://www.electronjs.org/docs/latest/api/app#appgetpathname",
]

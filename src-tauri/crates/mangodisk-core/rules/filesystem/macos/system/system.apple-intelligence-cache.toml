id = "system.apple-intelligence-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "system"
risk = "recoverable"
default_selected = false
required_stopped_processes = []

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${user_library}/Caches/com.apple.e5rt.e5bundlecache"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "The rule selects only the e5 runtime bundle cache under Library/Caches; Apple defines that directory for discardable data, and model directories remain outside the root"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://developer.apple.com/documentation/foundation/url/cachesdirectory"]

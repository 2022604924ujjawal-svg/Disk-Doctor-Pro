id = "dev.gradle-cache"
schema_version = 3
rule_version = 3
platform = "macos"
category = "development"
risk = "recoverable"
default_selected = false
recommended_selected = true
required_stopped_processes = ["gradle", "java"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "executableAvailable", names = ["gradle", "java"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${home}/.gradle/caches"
verified_rebuildable = true

[[roots]]
template = "${home}/.gradle/daemon"
verified_rebuildable = true

[[roots]]
template = "${home}/.gradle/workers"
verified_rebuildable = true

[[roots]]
template = "${home}/.gradle/notifications"
verified_rebuildable = true

[[roots]]
template = "${home}/.gradle/wrapper/dists"
verified_rebuildable = true

[[roots]]
template = "${home}/.gradle/.tmp"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteWholeRoot"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Gradle-managed caches, daemon state, temporary files, and downloaded Wrapper distributions are rebuildable after processes stop; projects, user properties, init scripts, and installed JDKs remain outside the roots"
verified_at = "2026-08-21"
verified_platform = "macos"
references = ["https://docs.gradle.org/current/userguide/directory_layout.html"]

id = "dev.maven-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "development"
risk = "recoverable"
default_selected = false
required_stopped_processes = ["mvn", "java"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "executableAvailable", names = ["mvn"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${home}/.m2/repository"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteWholeRoot"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "The Maven local repository contains downloaded and locally installed artifacts; settings.xml remains outside the cleanup root"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://maven.apache.org/guides/mini/guide-configuring-maven.html"]

id = "dev.node-gyp-cache"
schema_version = 3
rule_version = 2
platform = "macos"
category = "development"
risk = "recoverable"
default_selected = false
recommended_selected = true
required_stopped_processes = []

[[applicability]]
kind = "anyOf"
items = [
  { kind = "executableAvailable", names = ["node", "npm"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/node-gyp"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteWholeRoot"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "node-gyp documents devdir as the SDK download directory and defaults it to the operating-system cache location; project sources and npm configuration remain outside the root"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://github.com/nodejs/node-gyp#command-options"]

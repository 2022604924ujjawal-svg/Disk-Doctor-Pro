id = "dev.copilot-cli-cache"
schema_version = 3
rule_version = 1
platform = "macos"
category = "development"
risk = "recoverable"
default_selected = false
required_stopped_processes = ["copilot"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "executableAvailable", names = ["copilot"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${user_library}/Caches/copilot"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "GitHub documents this directory as ephemeral Copilot CLI marketplace and auto-update cache, separate from configuration and session history"
verified_at = "2026-07-18"
verified_platform = "macos"
references = ["https://docs.github.com/en/copilot/reference/copilot-cli-reference/cli-config-dir-reference#changing-the-location-of-the-configuration-directory"]

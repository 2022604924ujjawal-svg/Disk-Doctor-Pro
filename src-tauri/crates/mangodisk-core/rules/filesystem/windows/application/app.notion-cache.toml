# Notion stores its local database, offline content, browser persistence, and
# renderer partitions under one roaming profile. Dynamic discovery is limited
# to direct partition children followed by fixed disposable cache suffixes.
id = "app.notion-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["Notion.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["Notion", "Notion Labs, Inc."] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${roaming_app_data}/Notion/Cache"

[[roots]]
template = "${roaming_app_data}/Notion/Code Cache"

[[roots]]
template = "${roaming_app_data}/Notion/GPUCache"

[[roots]]
template = "${roaming_app_data}/Notion/DawnCache"

[[roots]]
template = "${roaming_app_data}/Notion/DawnGraphiteCache"

[[roots]]
template = "${roaming_app_data}/Notion/DawnWebGPUCache"

[[roots]]
template = "${roaming_app_data}/Notion/GrShaderCache"

[[roots]]
template = "${roaming_app_data}/Notion/GraphiteDawnCache"

[[roots]]
template = "${roaming_app_data}/Notion/Shared Dictionary/cache"

[[roots]]
template = "${roaming_app_data}/Notion/logs"

[[roots]]
template = "${roaming_app_data}/Notion/Crashpad/reports"

# Every direct child represents a Notion renderer partition. Databases,
# offline content, cookies, Local Storage, IndexedDB, Service Worker, Network,
# Preferences, and all other durable state remain outside this suffix list.
[[roots]]
template = "${roaming_app_data}/Notion/Partitions"
kind = "childDirectories"
include_all_children = true
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Shared Dictionary/cache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed Notion 7.29.0 reproduced one renderer partition plus fixed Electron cache leaves. The local database, offline content, cookies, browser storage, preferences, network state, application binaries, and updater state remain excluded"
verified_at = "2026-08-11"
verified_platform = "windows"
references = [
  "https://www.notion.com/help/reset-notion",
  "https://www.notion.com/help/use-pages-offline",
  "https://www.electronjs.org/docs/latest/api/app#appgetpathname",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

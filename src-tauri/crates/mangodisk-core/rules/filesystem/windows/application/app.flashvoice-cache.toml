# FlashVoice keeps models, recordings, transcription indexes, and settings in
# Roaming AppData. Its WebView2 profile is mixed-purpose, so the rule selects
# fixed renderer-cache leaves and diagnostics without clearing the profile.
id = "app.flashvoice-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["FlashVoice.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["FlashVoice", "com.flashvoices"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/component_crx_cache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/extensions_crx_cache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/GPUPersistentCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/GraphiteDawnCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/GrShaderCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/ShaderCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Crashpad/reports"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/Cache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/Code Cache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/GPUCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/DawnCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/DawnGraphiteCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/DawnWebGPUCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/GrShaderCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/GraphiteDawnCache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/Shared Dictionary/cache"

[[roots]]
template = "${local_app_data}/com.flashvoices/EBWebView/Default/Service Worker/CacheStorage"

[[roots]]
template = "${roaming_app_data}/com.flashvoices/logs"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed FlashVoice 1.4.5 reproduced fixed WebView2 response, code, GPU, shader, component, dictionary, and report caches. Models, recordings, transcriptions, settings, browser state, and application files are excluded"
verified_at = "2026-08-11"
verified_platform = "windows"
references = [
  "https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/user-data-folder",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

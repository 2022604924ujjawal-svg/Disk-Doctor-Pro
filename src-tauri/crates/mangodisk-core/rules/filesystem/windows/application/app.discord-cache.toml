# Discord keeps account and browser persistence beside standard Electron cache
# leaves. Only fixed renderer, diagnostic-log, and crash-report boundaries are
# selected; the complete user-data directory is never treated as disposable.
id = "app.discord-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = ["Discord.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["Discord", "Discord Inc."] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${roaming_app_data}/discord/Cache"

[[roots]]
template = "${roaming_app_data}/discord/Code Cache"

[[roots]]
template = "${roaming_app_data}/discord/GPUCache"

[[roots]]
template = "${roaming_app_data}/discord/DawnCache"

[[roots]]
template = "${roaming_app_data}/discord/DawnGraphiteCache"

[[roots]]
template = "${roaming_app_data}/discord/DawnWebGPUCache"

[[roots]]
template = "${roaming_app_data}/discord/GrShaderCache"

[[roots]]
template = "${roaming_app_data}/discord/GraphiteDawnCache"

[[roots]]
template = "${roaming_app_data}/discord/Shared Dictionary/cache"

[[roots]]
template = "${roaming_app_data}/discord/logs"

[[roots]]
template = "${roaming_app_data}/discord/Crashpad/reports"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed Discord 1.0.9251 reproduced fixed response, code, GPU, Dawn, dictionary, log, and crash-report leaves. Accounts, chats, settings, cookies, Network, Local Storage, Service Worker, sessions, WebStorage, and application binaries remain excluded"
verified_at = "2026-08-11"
verified_platform = "windows"
references = [
  "https://support.discord.com/hc/en-us/articles/115004307527--Windows-Corrupt-Installation",
  "https://www.electronjs.org/docs/latest/api/app#appgetpathname",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

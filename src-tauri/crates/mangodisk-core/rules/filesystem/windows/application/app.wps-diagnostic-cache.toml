# WPS keeps recovery, cloud synchronization, templates, account state, and
# settings near fixed diagnostic directories. Only path segments named log or
# dump are selected, and the application must be fully stopped first.
id = "app.wps-diagnostic-cache"
schema_version = 3
rule_version = 2
platform = "windows"
category = "application"
risk = "safe"
default_selected = false
recommended_selected = true
required_stopped_processes = [
  "wpsoffice.exe",
  "wps.exe",
  "et.exe",
  "wpp.exe",
  "wpspdf.exe",
  "wpscloudsvr.exe",
  "wpscenter.exe",
  "promecefpluginhost.exe",
  "ksomisc.exe",
  "wpsupdate.exe",
]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["Kingsoft.WPSOffice.CN", "WPS Office", "WPS Office CN"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${roaming_app_data}/Kingsoft/office6"

[matcher]
kind = "pathSegmentIn"
values = ["log", "dump"]

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed WPS Office 12.1.0.28043 reproduced isolated application, renderer, cloud-service, setup, updater, workspace, and crash diagnostics. Documents, recovery data, backups, cloud files, templates, accounts, add-ons, and settings are excluded"
verified_at = "2026-08-11"
verified_platform = "windows"
references = ["https://www.wps.cn/product/wpswin"]

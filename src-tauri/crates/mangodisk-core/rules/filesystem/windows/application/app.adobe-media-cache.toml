# Adobe media caches are rebuildable but increase analysis time when a project
# is reopened, so automatic cleanup remains disabled; including it in the shared
# recommendation still requires explicit cleanup intent. Project media, presets,
# and Creative Cloud sync directories are outside this boundary.
id = "app.adobe-media-cache"
schema_version = 3
rule_version = 2
platform = "windows"
category = "application"
risk = "recoverable"
default_selected = false
recommended_selected = true
required_stopped_processes = ["Adobe Premiere Pro.exe", "AfterFX.exe", "Adobe Media Encoder.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["Adobe Premiere Pro", "Adobe After Effects", "Adobe Media Encoder"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/Adobe/Common/Media Cache Files"
verified_rebuildable = true

[[roots]]
template = "${roaming_app_data}/Adobe/Common/Media Cache Files"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Adobe documents Common/Media Cache Files as regenerated accelerator data and provides an in-app deletion workflow; project media, presets, application settings, and Creative Cloud data remain outside the roots"
verified_at = "2026-07-17"
verified_platform = "windows"
references = ["https://helpx.adobe.com/premiere/desktop/troubleshooting/media-issues/manage-media-cache.html"]

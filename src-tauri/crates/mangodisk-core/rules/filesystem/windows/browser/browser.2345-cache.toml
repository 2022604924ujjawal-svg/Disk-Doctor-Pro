# 2345 Browser stores durable Chromium profile state beside renderer caches.
# Only reproducible cache leaves are selected.
id = "browser.2345-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["2345Explorer.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["2345浏览器", "2345加速浏览器", "2345Explorer"] },
  { kind = "executableAvailable", names = ["2345Explorer.exe"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/2345Explorer/User Data/ShaderCache"

[[roots]]
template = "${local_app_data}/2345Explorer/User Data/GrShaderCache"

[[roots]]
template = "${local_app_data}/2345Explorer/User Data"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "Shared Dictionary/cache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Signed 2345 Browser 13.7.0.41868 on Windows 11 reproduced fixed web, code, GPU, Dawn, and shader caches; real cleanup preserved credentials, history, extensions, sessions, local storage, and settings"
verified_at = "2026-08-21"
verified_platform = "windows"
references = [
  "https://www.2345.com/",
  "https://chromium.googlesource.com/chromium/src/+/main/docs/user_data_dir.md",
]

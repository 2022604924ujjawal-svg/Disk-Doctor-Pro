id = "browser.edge-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["Microsoft Edge", "msedge.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["Microsoft Edge", "Microsoft Edge Update"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data/ShaderCache"

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data/GrShaderCache"

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data/GraphiteDawnCache"

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data/DawnGraphiteCache"

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data/DawnWebGPUCache"

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data/component_crx_cache"

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data/extensions_crx_cache"

[[roots]]
template = "${local_app_data}/Microsoft/Edge/User Data"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Media Cache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "The rule selects only named renderer, shader, media, and extension-package cache directories from Edge's documented user-data profiles; cookies, history, passwords, bookmarks, installed extensions, and other profile data are excluded"
verified_at = "2026-07-18"
verified_platform = "windows"
references = [
  "https://learn.microsoft.com/en-us/deployedge/edge-learnmore-create-user-directory-vars",
  "https://learn.microsoft.com/en-us/deployedge/microsoft-edge-policies/userdatadir",
]

id = "browser.vivaldi-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["Vivaldi", "vivaldi.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.vivaldi.Vivaldi", "Vivaldi"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/Vivaldi/User Data/ShaderCache"

[[roots]]
template = "${local_app_data}/Vivaldi/User Data/GrShaderCache"

[[roots]]
template = "${local_app_data}/Vivaldi/User Data/GraphiteDawnCache"

[[roots]]
template = "${local_app_data}/Vivaldi/User Data/DawnGraphiteCache"

[[roots]]
template = "${local_app_data}/Vivaldi/User Data/DawnWebGPUCache"

[[roots]]
template = "${local_app_data}/Vivaldi/User Data/component_crx_cache"

[[roots]]
template = "${local_app_data}/Vivaldi/User Data/extensions_crx_cache"

[[roots]]
template = "${local_app_data}/Vivaldi/User Data"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Media Cache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "The rule selects only named renderer, shader, media, and extension-package cache directories from Vivaldi's user-data profiles; cookies, history, passwords, bookmarks, installed extensions, and other profile data are excluded"
verified_at = "2026-07-18"
verified_platform = "windows"
references = ["https://help.vivaldi.com/desktop/tools/delete-browsing-data/"]

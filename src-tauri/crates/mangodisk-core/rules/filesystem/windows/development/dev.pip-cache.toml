id = "dev.pip-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "development"
risk = "recoverable"
default_selected = false
required_stopped_processes = []

[[applicability]]
kind = "anyOf"
items = [
  { kind = "executableAvailable", names = ["python.exe", "pip.exe"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/pip/Cache"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "pip documents its cache as downloaded HTTP responses and locally built wheels and provides pip cache purge; package environments, configuration, and credentials remain outside the root"
verified_at = "2026-07-18"
verified_platform = "windows"
references = ["https://pip.pypa.io/en/stable/topics/caching/"]

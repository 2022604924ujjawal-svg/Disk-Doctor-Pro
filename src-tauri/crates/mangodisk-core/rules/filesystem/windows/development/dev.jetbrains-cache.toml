id = "dev.jetbrains-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "development"
risk = "recoverable"
default_selected = false
required_stopped_processes = ["idea64.exe", "studio64.exe", "pycharm64.exe", "webstorm64.exe"]

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${local_app_data}/JetBrains"
kind = "childDirectories"
include_all_children = true
suffixes = ["caches", "index", "tmp", "log", "compile-server"]
verified_rebuildable = true

[[roots]]
template = "${local_app_data}/Google"
kind = "childDirectories"
child_prefixes = ["AndroidStudio"]
suffixes = ["caches", "index", "tmp", "log", "compile-server"]
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "JetBrains documents caches and indexes in the IDE system directory and recreates them after cache invalidation; the rule selects only caches, index, tmp, log, and compile-server suffixes while settings, plugins, projects, and Local History remain excluded"
verified_at = "2026-07-18"
verified_platform = "windows"
references = [
  "https://www.jetbrains.com/help/idea/tuning-the-ide.html#system-directory",
  "https://www.jetbrains.com/help/idea/invalidate-caches.html",
]

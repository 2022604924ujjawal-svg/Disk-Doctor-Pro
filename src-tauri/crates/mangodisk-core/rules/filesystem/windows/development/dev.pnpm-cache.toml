id = "dev.pnpm-cache"
schema_version = 3
rule_version = 2
platform = "windows"
category = "development"
risk = "recoverable"
default_selected = false
required_stopped_processes = []

[[applicability]]
kind = "anyOf"
items = [
  { kind = "executableAvailable", names = ["pnpm.exe", "pnpm.cmd"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${local_app_data}/pnpm/store"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteWholeRoot"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "pnpm documents its store as content-addressable package data and provides store path, status, and prune operations; project manifests, configuration, and global executables remain outside the root"
verified_at = "2026-07-18"
verified_platform = "windows"
references = ["https://pnpm.io/cli/store"]

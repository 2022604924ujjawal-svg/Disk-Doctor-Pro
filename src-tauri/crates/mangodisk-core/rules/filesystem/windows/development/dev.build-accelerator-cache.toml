id = "dev.build-accelerator-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "development"
risk = "recoverable"
default_selected = false
required_stopped_processes = ["sccache.exe", "terraform.exe"]

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${home}/.cache/sccache"

[[roots]]
template = "${home}/.terraform.d/plugin-cache"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "sccache documents its local disk artifact cache separately from configuration, and Terraform documents plugin-cache as downloaded providers reused by terraform init; project state, lock files, and tool configuration remain outside the roots"
verified_at = "2026-07-18"
verified_platform = "windows"
references = [
  "https://github.com/mozilla/sccache/blob/main/docs/Configuration.md",
  "https://developer.hashicorp.com/terraform/cli/config/config-file#provider-plugin-cache",
]

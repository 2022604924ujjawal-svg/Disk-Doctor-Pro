id = "dev.cargo-cache"
schema_version = 3
rule_version = 1
platform = "windows"
category = "development"
risk = "recoverable"
default_selected = false
required_stopped_processes = []

[[applicability]]
kind = "anyOf"
items = [
  { kind = "executableAvailable", names = ["cargo.exe"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${home}/.cargo/registry/cache"

[[roots]]
template = "${home}/.cargo/registry/src"
verified_rebuildable = true

[[roots]]
template = "${home}/.cargo/git"
verified_rebuildable = true

[[roots]]
template = "${home}/.rustup/downloads"
verified_rebuildable = true

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "Cargo documents registry/cache, registry/src, and git as downloaded dependency caches and states cached sources can be restored; the rule also selects rustup's incomplete download area while preserving credentials and installed toolchains"
verified_at = "2026-07-18"
verified_platform = "windows"
references = [
  "https://doc.rust-lang.org/cargo/guide/cargo-home.html",
  "https://rust-lang.github.io/rustup/installation/",
]

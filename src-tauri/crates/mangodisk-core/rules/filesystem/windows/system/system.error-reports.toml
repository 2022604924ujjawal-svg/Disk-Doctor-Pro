id = "system.error-reports"
schema_version = 3
rule_version = 1
platform = "windows"
category = "system"
risk = "safe"
default_selected = true
required_stopped_processes = []

[[applicability]]
kind = "anyRootExists"

[[roots]]
template = "${local_app_data}/Microsoft/Windows/WER/ReportArchive"

[[roots]]
template = "${local_app_data}/Microsoft/Windows/WER/ReportQueue"

[[roots]]
template = "${local_app_data}/Microsoft/Windows/WER/Temp"

[[roots]]
template = "${program_data}/Microsoft/Windows/WER/ReportArchive"

[[roots]]
template = "${program_data}/Microsoft/Windows/WER/ReportQueue"

[[roots]]
template = "${program_data}/Microsoft/Windows/WER/Temp"

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = false

[verification]
lifecycle = "verified"
evidence = "Windows Error Reporting defines user and machine archive and queue report stores; the rule targets only ReportArchive, ReportQueue, and Temp contents and preserves reports newer than seven days"
verified_at = "2026-07-18"
verified_platform = "windows"
references = ["https://learn.microsoft.com/en-us/windows/win32/api/werapi/ne-werapi-report_store_types"]

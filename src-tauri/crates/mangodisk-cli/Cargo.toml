[package]
name = "mangodisk-cli"
version.workspace = true
description = "MangoDisk command-line automation adapter"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "mangodisk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
env_logger = "0.11"
mangodisk-core = { path = "../mangodisk-core" }
mangodisk-platform = { path = "../mangodisk-platform" }
log = "0.4.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package]
name = "mangodisk"
version.workspace = true
description = "MangoDisk cross-platform disk space manager"
authors = ["harry0703"]
edition.workspace = true
rust-version.workspace = true

[lib]
name = "mangodisk_lib"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
portable = []

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22"
blake3 = "1"
log = "0.4.33"
mangodisk-core = { path = "crates/mangodisk-core" }
mangodisk-platform = { path = "crates/mangodisk-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.9.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-prevent-default = { version = "2.1", features = ["unstable-windows"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-store = "2.4.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
icns = "0.4"
plist = "1.7"
